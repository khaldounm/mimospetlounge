# Nightly backup of every clinic's Supabase database to Google Drive.
#
# Supabase's free tier keeps no backups at all, so this is the only copy of the
# clinics' data outside the live databases. It runs on GitHub's schedule rather
# than a laptop, so it does not depend on anyone's machine being awake.
#
# One codebase serves several clinics, each with its own database, so the job
# is a matrix: one entry per clinic below, each naming the secrets that hold
# ITS connection string, Drive folder and passphrase. A clinic whose secrets
# are not set yet is skipped with a notice rather than failing the run, so a
# new entry can be committed before its secrets exist.
#
# Shared repository secrets (Settings > Secrets and variables > Actions):
#   GDRIVE_CLIENT_ID     from `rclone config` on your machine
#   GDRIVE_CLIENT_SECRET  "
#   GDRIVE_TOKEN         the {"access_token":...} JSON rclone stores
#
# Per clinic (the names are given in the matrix, these are Mimo's):
#   SUPABASE_DB_URL      the DIRECT connection string, port 5432 (NOT 6543:
#                        the transaction pooler cannot serve pg_dump)
#   BACKUP_PASSPHRASE    long random string; encrypts the dump before upload
#   GDRIVE_FOLDER_ID     id of the Drive folder to write into (from its URL)

name: Database backup

on:
  schedule:
    # 22:00 UTC daily. GitHub's scheduler can lag by a few minutes under load,
    # which is fine for a nightly backup.
    - cron: "0 22 * * *"
  workflow_dispatch: # so a backup can be taken by hand before risky changes

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        clinic:
          # `prefix` names the files in Drive and must match backupPrefix in
          # src/constants/clinics/<id>.ts, so a nightly file and a local
          # `pnpm db:backup` of the same clinic sort together and the prune
          # pattern below only ever touches that clinic's files.
          - id: mimo
            prefix: mimos
            db_url_secret: SUPABASE_DB_URL
            passphrase_secret: BACKUP_PASSPHRASE
            folder_secret: GDRIVE_FOLDER_ID
          - id: nadine
            prefix: nadine
            db_url_secret: NADINE_SUPABASE_DB_URL
            passphrase_secret: NADINE_BACKUP_PASSPHRASE
            folder_secret: NADINE_GDRIVE_FOLDER_ID
    concurrency:
      group: db-backup-${{ matrix.clinic.id }}
      cancel-in-progress: false
    env:
      PREFIX: ${{ matrix.clinic.prefix }}
    steps:
      - name: Check this clinic is configured
        id: configured
        env:
          DB_URL: ${{ secrets[matrix.clinic.db_url_secret] }}
          PASSPHRASE: ${{ secrets[matrix.clinic.passphrase_secret] }}
          FOLDER: ${{ secrets[matrix.clinic.folder_secret] }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ] || [ -z "$FOLDER" ]; then
            echo "::notice::${{ matrix.clinic.id }}: secrets not set, skipping this clinic."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 17 client
        if: steps.configured.outputs.ok == 'true'
        # The client must be at least the server's major version. Supabase is
        # on 17.6; ubuntu-latest ships an older client by default.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # /usr/bin/pg_dump is a pg_wrapper shim that picks its version from
          # the newest server cluster on the box, and the runner image ships a
          # PostgreSQL 16 cluster. Left alone it runs 16.14 against a 17.6
          # server and aborts. Put the real 17 binaries first instead.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump the database
        if: steps.configured.outputs.ok == 'true'
        env:
          DB_URL: ${{ secrets[matrix.clinic.db_url_secret] }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # Flags kept identical to src/lib/db-transfer.ts so a file from either
          # source restores the same way.
          pg_dump "$DB_URL" \
            --format=custom --no-owner --no-privileges --schema=public \
            --file="$PREFIX-$STAMP.dump"
          ls -lh "$PREFIX-$STAMP.dump"

      - name: Verify the dump is readable
        if: steps.configured.outputs.ok == 'true'
        # A backup nobody has ever opened is not a backup. This does not prove a
        # full restore works, but it does catch a truncated or empty archive,
        # which is the common silent failure.
        run: |
          set -euo pipefail
          TABLES=$(pg_restore --list "$PREFIX-$STAMP.dump" | grep -c "TABLE DATA" || true)
          echo "tables with data in archive: $TABLES"
          if [ "$TABLES" -lt 20 ]; then
            echo "::error::Archive holds only $TABLES data tables; expected 25+."
            exit 1
          fi

      - name: Encrypt
        if: steps.configured.outputs.ok == 'true'
        # The dump is real client PII: names, phone numbers, payment history.
        # It is encrypted before it leaves the runner, so Drive only ever holds
        # ciphertext. Decrypt with:
        #   gpg --decrypt --batch --passphrase "$BACKUP_PASSPHRASE" file.dump.gpg > file.dump
        env:
          PASSPHRASE: ${{ secrets[matrix.clinic.passphrase_secret] }}
        run: |
          set -euo pipefail
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$PASSPHRASE" \
            --output "$PREFIX-$STAMP.dump.gpg" "$PREFIX-$STAMP.dump"
          rm -f "$PREFIX-$STAMP.dump"
          ls -lh "$PREFIX-$STAMP.dump.gpg"

      - name: Upload to Google Drive
        if: steps.configured.outputs.ok == 'true'
        # rclone is installed from its official script rather than via a
        # third-party action, because this step is handed the Drive token and
        # there is no reason to widen who can see it.
        #
        # Config comes from environment variables, so nothing is written to disk
        # and the token never appears in a file the runner leaves behind.
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets[matrix.clinic.folder_secret] }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone copy "$PREFIX-$STAMP.dump.gpg" gdrive: --no-traverse
          echo "uploaded $PREFIX-$STAMP.dump.gpg"
          # Read it back so a silent upload failure cannot pass as success.
          rclone lsl gdrive: --include "$PREFIX-$STAMP.dump.gpg" | tee /tmp/verify
          test -s /tmp/verify

      - name: Prune backups older than 30 days
        if: steps.configured.outputs.ok == 'true'
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets[matrix.clinic.folder_secret] }}
        run: |
          set -euo pipefail
          rclone delete gdrive: --min-age 30d --include "$PREFIX-*.dump.gpg"
          echo "backups now held:"
          rclone lsl gdrive: --include "$PREFIX-*.dump.gpg" | wc -l
