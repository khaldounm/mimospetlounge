# Nightly backup of every clinic's Supabase database to Cloudflare R2.
#
# Supabase's free tier keeps no backups at all, so this is the only copy of the
# clinics' data outside the live databases. It runs on GitHub's schedule rather
# than a laptop, so it does not depend on anyone's machine being awake, and it
# lands in a different provider from the database on purpose: a backup that
# lives inside the project it protects dies with it.
#
# One codebase serves several clinics, each with its own database, so the job
# is a matrix: one entry per clinic below, each naming its bucket and the
# secrets that hold ITS connection string, passphrase and R2 credentials. A
# clinic whose secrets are not set yet is skipped with a notice rather than
# failing the run, so a new entry can be committed before its secrets exist.
#
# Shared repository secret (Settings > Secrets and variables > Actions):
#   R2_ACCOUNT_ID        Cloudflare account id; the S3 endpoint is derived
#                        from it
#
# Per clinic (the names are given in the matrix, these are Mimo's):
#   SUPABASE_DB_URL      the DIRECT connection string, port 5432 (NOT 6543:
#                        the transaction pooler cannot serve pg_dump)
#   BACKUP_PASSPHRASE    long random string; encrypts the dump before upload
#   R2_ACCESS_KEY_ID     an R2 API token with Object Read & Write on that
#   R2_SECRET_ACCESS_KEY clinic's bucket. Both clinics may name the same pair
#                        (one token scoped to both buckets) or each its own.
#
# Files are named <prefix>-<stamp>.dump.gpg and pruned after 30 days per
# bucket, so the bucket holds a rolling month.

name: Database backup

on:
  schedule:
    # 22:00 UTC daily. GitHub's scheduler can lag by a few minutes under load,
    # which is fine for a nightly backup.
    - cron: "0 22 * * *"
  workflow_dispatch: # so a backup can be taken by hand before risky changes

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        clinic:
          # `prefix` names the files in Drive and must match backupPrefix in
          # src/constants/clinics/<id>.ts, so a nightly file and a local
          # `pnpm db:backup` of the same clinic sort together and the prune
          # pattern below only ever touches that clinic's files.
          - id: mimo
            prefix: mimos
            bucket: mimos-backups
            db_url_secret: SUPABASE_DB_URL
            passphrase_secret: BACKUP_PASSPHRASE
            key_id_secret: R2_ACCESS_KEY_ID
            secret_key_secret: R2_SECRET_ACCESS_KEY
          - id: nadine
            prefix: nadine
            bucket: nadine-backups
            db_url_secret: NADINE_SUPABASE_DB_URL
            passphrase_secret: NADINE_BACKUP_PASSPHRASE
            key_id_secret: R2_ACCESS_KEY_ID
            secret_key_secret: R2_SECRET_ACCESS_KEY
    concurrency:
      group: db-backup-${{ matrix.clinic.id }}
      cancel-in-progress: false
    env:
      PREFIX: ${{ matrix.clinic.prefix }}
      BUCKET: ${{ matrix.clinic.bucket }}
      # rclone reads a remote's whole config from the environment, so nothing
      # is written to disk and no credential appears in a file the runner
      # leaves behind. R2 speaks S3; the region is always "auto".
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_REGION: auto
      # An object-scoped token may not HEAD or create buckets; without this
      # rclone mistakes the refusal for a missing bucket and tries to create
      # it, which the token rightly cannot do.
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets[matrix.clinic.key_id_secret] }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets[matrix.clinic.secret_key_secret] }}
    steps:
      - name: Check this clinic is configured
        id: configured
        env:
          DB_URL: ${{ secrets[matrix.clinic.db_url_secret] }}
          PASSPHRASE: ${{ secrets[matrix.clinic.passphrase_secret] }}
          ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          KEY_ID: ${{ secrets[matrix.clinic.key_id_secret] }}
          SECRET_KEY: ${{ secrets[matrix.clinic.secret_key_secret] }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ] || [ -z "$ACCOUNT" ] || [ -z "$KEY_ID" ] || [ -z "$SECRET_KEY" ]; then
            echo "::notice::${{ matrix.clinic.id }}: secrets not set, skipping this clinic."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 17 client
        if: steps.configured.outputs.ok == 'true'
        # The client must be at least the server's major version. Supabase is
        # on 17.6; ubuntu-latest ships an older client by default.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # /usr/bin/pg_dump is a pg_wrapper shim that picks its version from
          # the newest server cluster on the box, and the runner image ships a
          # PostgreSQL 16 cluster. Left alone it runs 16.14 against a 17.6
          # server and aborts. Put the real 17 binaries first instead.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump the database
        if: steps.configured.outputs.ok == 'true'
        env:
          DB_URL: ${{ secrets[matrix.clinic.db_url_secret] }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # Flags kept identical to src/lib/db-transfer.ts so a file from either
          # source restores the same way.
          pg_dump "$DB_URL" \
            --format=custom --no-owner --no-privileges --schema=public \
            --file="$PREFIX-$STAMP.dump"
          ls -lh "$PREFIX-$STAMP.dump"

      - name: Verify the dump is readable
        if: steps.configured.outputs.ok == 'true'
        # A backup nobody has ever opened is not a backup. This does not prove a
        # full restore works, but it does catch a truncated or empty archive,
        # which is the common silent failure.
        run: |
          set -euo pipefail
          TABLES=$(pg_restore --list "$PREFIX-$STAMP.dump" | grep -c "TABLE DATA" || true)
          echo "tables with data in archive: $TABLES"
          if [ "$TABLES" -lt 20 ]; then
            echo "::error::Archive holds only $TABLES data tables; expected 25+."
            exit 1
          fi

      - name: Encrypt
        if: steps.configured.outputs.ok == 'true'
        # The dump is real client PII: names, phone numbers, payment history.
        # It is encrypted before it leaves the runner, so Drive only ever holds
        # ciphertext. Decrypt with:
        #   gpg --decrypt --batch --passphrase "$BACKUP_PASSPHRASE" file.dump.gpg > file.dump
        env:
          PASSPHRASE: ${{ secrets[matrix.clinic.passphrase_secret] }}
        run: |
          set -euo pipefail
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$PASSPHRASE" \
            --output "$PREFIX-$STAMP.dump.gpg" "$PREFIX-$STAMP.dump"
          rm -f "$PREFIX-$STAMP.dump"
          ls -lh "$PREFIX-$STAMP.dump.gpg"

      - name: Upload to R2
        if: steps.configured.outputs.ok == 'true'
        # rclone is installed from its official script rather than via a
        # third-party action, because this step is handed the bucket
        # credentials and there is no reason to widen who can see them.
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone copy "$PREFIX-$STAMP.dump.gpg" "r2:$BUCKET" --no-traverse
          echo "uploaded $PREFIX-$STAMP.dump.gpg to $BUCKET"
          # Read it back so a silent upload failure cannot pass as success.
          rclone lsl "r2:$BUCKET" --include "$PREFIX-$STAMP.dump.gpg" | tee /tmp/verify
          test -s /tmp/verify

      - name: Prune backups older than 30 days
        if: steps.configured.outputs.ok == 'true'
        run: |
          set -euo pipefail
          rclone delete "r2:$BUCKET" --min-age 30d --include "$PREFIX-*.dump.gpg"
          echo "backups now held in $BUCKET:"
          rclone lsl "r2:$BUCKET" --include "$PREFIX-*.dump.gpg" | wc -l
